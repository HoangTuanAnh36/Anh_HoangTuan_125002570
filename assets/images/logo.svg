<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="soleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4600" />
      <stop offset="100%" stop-color="#ff7a00" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon: Lightning Sole / Speed Wing -->
  <g transform="translate(10, 10)">
    <polygon points="15,45 35,5 25,28 45,18 20,58 28,38" fill="url(#soleGradient)" filter="url(#neonGlow)"/>
    <path d="M42,22 L55,14 C58,12 62,15 60,19 L52,32 C50,35 46,37 42,35 Z" fill="#ff7a00" opacity="0.8"/>
  </g>
  
  <!-- Text: SOLE FORCE -->
  <text x="82" y="44" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1">SOLE</text>
  <text x="170" y="44" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="url(#soleGradient)" letter-spacing="1" filter="url(#neonGlow)">FORCE</text>
  
  <!-- Slogan / Subtitle -->
  <text x="84" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#9ca3af" letter-spacing="3.5">ATHLETIC FOOTWEAR</text>
</svg>
